name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The same build.sh users and the Homebrew formula run, ad-hoc signed (CI has no certificate).
      - name: Build universal app (ad-hoc signed)
        run: IDENTITY=- ./build.sh --no-install

      - name: Check the bundle
        run: |
          codesign --verify --deep --strict --verbose=2 build/QuickConvert.app
          codesign -d --entitlements - build/QuickConvert.app/Contents/PlugIns/QuickConvertFinder.appex | grep -q app-sandbox
          lipo -archs build/QuickConvert.app/Contents/MacOS/QuickConvert
          bin/quickconvert --help

      - name: Validate property lists
        run: plutil -lint App/Info.plist Extension/Info.plist Extension/Extension.entitlements
